suite: object-storage fraud-detection consumer contract
# Parents can keep short DNS (fullnameOverride: s4) while depending on this generic chart
values:
  - values/auth.yaml
set:
  fullnameOverride: s4
  image.repository: quay.io/rh-aiservices-bu/s4
  image.tag: "0.3.2"
  image.pullPolicy: IfNotPresent
  s3.accessKeyId: s4admin
  s3.secretAccessKey: s4secret
  route.enabled: true
  route.s3Api.enabled: false
  storage.data.size: 10Gi
templates:
  - templates/service.yaml
  - templates/secret.yaml
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/route.yaml
  - templates/route-s3.yaml
tests:
  - it: Service is named s4 with S3 port 7480
    template: templates/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: s4
      - contains:
          path: spec.ports
          content:
            name: s3-api
            port: 7480
            targetPort: 7480
            protocol: TCP

  - it: credentials Secret is s4-credentials with AWS keys
    template: templates/secret.yaml
    asserts:
      - equal:
          path: metadata.name
          value: s4-credentials
      - equal:
          path: stringData.AWS_ACCESS_KEY_ID
          value: s4admin
      - equal:
          path: stringData.AWS_SECRET_ACCESS_KEY
          value: s4secret

  - it: Deployment references s4-credentials and readiness /api
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: s4
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/rh-aiservices-bu/s4:0.3.2
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: s4-credentials
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api

  - it: UI Route is enabled
    template: templates/route.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Route
      - equal:
          path: spec.port.targetPort
          value: web-ui

  - it: S3 API Route is disabled
    template: templates/route-s3.yaml
    asserts:
      - hasDocuments:
          count: 0
