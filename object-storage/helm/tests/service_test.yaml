suite: object-storage service
values:
  - values/auth.yaml
templates:
  - templates/service.yaml
tests:
  - it: exposes S3 API 7480 and Web UI 5000
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - contains:
          path: spec.ports
          content:
            name: s3-api
            port: 7480
            targetPort: 7480
            protocol: TCP
      - contains:
          path: spec.ports
          content:
            name: web-ui
            port: 5000
            targetPort: 5000
            protocol: TCP

  - it: names the Service when fullnameOverride is set
    set:
      fullnameOverride: object-storage
    asserts:
      - equal:
          path: metadata.name
          value: object-storage

  - it: creates an additional NodePort Service when enabled
    set:
      service.nodePort.enabled: true
    asserts:
      - hasDocuments:
          count: 2

  - it: second document is the NodePort Service
    set:
      service.nodePort.enabled: true
    documentIndex: 1
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - matchRegex:
          path: metadata.name
          pattern: "-nodeport$"
