name: Lint and Test Object Storage Helm Chart

on:
  pull_request:
    paths:
      - 'object-storage/helm/**'
      - '.github/workflows/lint-object-storage-chart.yaml'
  push:
    branches: [main]
    paths:
      - 'object-storage/helm/**'
      - '.github/workflows/lint-object-storage-chart.yaml'

jobs:
  lint-and-test-helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: helm lint object-storage/helm

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3

      - name: Run helm unittest
        run: helm unittest object-storage/helm
