# Bundled AWS-compatible storage subchart configuration
aws-compatible-storage:
  # Disable to use pipelineStorage.externalStorage instead.
  enabled: true
  fullnameOverride: aws-compatible-storage
  sampleFileUpload:
    # Keep aligned with notebook.s3.bucketName; pipeline artifacts use mlpipeline.
    bucket: llama
  # Only the in-cluster S3 API is needed, so disable UI auth and its public route.
  auth:
    enabled: false
  route:
    enabled: false

notebook:
  create: true
  image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:2024.2
  repo: "https://github.com/rh-ai-quickstart/RAG.git"
  pvcName: "pipeline-vol"
  embedding_model: all-MiniLM-L6-v2
  name: rag-vector-db
  version: 1.0
  # Notebook-specific S3 configuration
  s3:
    region: us-east-1
    bucketName: llama
    accessKeyId: ""
    secretAccessKey: ""

# Secret configuration for rag-pipeline-secrets
secret:
  create: true

# Pipeline storage configuration for DataSciencePipelinesApplication
pipelineStorage:
  # Endpoint and Secret name are required when aws-compatible-storage.enabled is false.
  externalStorage:
    host: ""
    port: "443"
    bucket: "mlpipeline"
    scheme: "https"
    s3CredentialsSecret:
      secretName: ""
      # DSPA fields below name Secret entries, not credential values.
      accessKey: "AWS_ACCESS_KEY_ID"
      secretKey: "AWS_SECRET_ACCESS_KEY"
