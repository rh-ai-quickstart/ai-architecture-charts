---
apiVersion: datasciencepipelinesapplications.opendatahub.io/v1
kind: DataSciencePipelinesApplication
metadata:
  name: dspa
spec:
  apiServer:
    artifactSignedURLExpirySeconds: 60
    caBundleFileMountPath: ''
    caBundleFileName: ''
    deploy: true
    enableOauth: true
    enableSamplePipeline: false
    {{- with .Values.managedPipelines }}
    managedPipelines:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  database:
    disableHealthCheck: false
    mariaDB:
      deploy: true
      pipelineDBName: mlpipeline
      pvcSize: 10Gi
      username: mlpipeline
  dspVersion: v2
  objectStorage:
    disableHealthCheck: false
    enableExternalRoute: false
    externalStorage:  # points to bundled AWS-compatible or caller-provided storage
{{- $storage := .Values.pipelineStorage.externalStorage | deepCopy }}
{{- if .Values.pipelineStorage.deployAwsCompatibleStorage }}
{{- $_ := set $storage "host" (printf "aws-compatible-storage.%s.svc.cluster.local" .Release.Namespace) }}
{{- $_ := set $storage "port" "7480" }}
{{- $_ := set $storage "scheme" "http" }}
{{- $_ := set $storage "s3CredentialsSecret" (dict "secretName" "aws-compatible-storage-credentials" "accessKey" "AWS_ACCESS_KEY_ID" "secretKey" "AWS_SECRET_ACCESS_KEY") }}
{{- end }}
{{ toYaml $storage | indent 6 }}
  persistenceAgent:
    deploy: true
    numWorkers: 2
  podToPodTLS: true
  scheduledWorkflow:
    cronScheduleTimezone: UTC
    deploy: true
