{{- if and .Values.notebook.create .Values.secret.create }}
# This secret will be used by the rag-pipeline-notebook
---
apiVersion: v1
kind: Secret
metadata:
  name: rag-ingestion-pipeline-secret
  annotations: {}
  labels:
    opendatahub.io/dashboard: 'true'
stringData:
  SOURCE: S3
  EMBEDDING_MODEL: {{ .Values.notebook.embedding_model }}
  NAME:  {{ .Values.notebook.name }}
  VERSION:  "{{ .Values.notebook.version }}"
{{- if (index .Values "aws-compatible-storage").enabled }}
{{- $s3 := (index .Values "aws-compatible-storage").s3 }}
{{- if $s3.existingSecret }}
{{- fail "aws-compatible-storage.s3.existingSecret is unsupported when notebook.create=true and secret.create=true: the dashboard Secret cannot copy credentials from an existing Secret; disable notebook.create or secret.create and manage the notebook Secrets yourself" }}
{{- end }}
  ACCESS_KEY_ID: {{ $s3.accessKeyId | quote }}
  SECRET_ACCESS_KEY: {{ $s3.secretAccessKey | quote }}
{{- else }}
  ACCESS_KEY_ID: {{ .Values.notebook.s3.accessKeyId | quote }}
  SECRET_ACCESS_KEY: {{ .Values.notebook.s3.secretAccessKey | quote }}
{{- end }}
  ENDPOINT_URL: {{ include "configure-pipeline.storageEndpoint" . | quote }}
  BUCKET_NAME: {{ .Values.notebook.s3.bucketName | quote }}
  REGION: {{ .Values.notebook.s3.region }}
{{- end }}
