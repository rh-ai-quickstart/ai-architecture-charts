suite: aws-compatible-storage secret
values:
  - values/auth.yaml
templates:
  - templates/secret.yaml
tests:
  - it: creates AWS credentials and UI auth keys
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: stringData.AWS_ACCESS_KEY_ID
          value: s4admin
      - equal:
          path: stringData.AWS_SECRET_ACCESS_KEY
          value: s4secret
      - equal:
          path: stringData.UI_USERNAME
          value: admin
      - equal:
          path: stringData.UI_PASSWORD
          value: changeme

  - it: uses fullnameOverride for credentials consumer contract
    set:
      fullnameOverride: aws-compatible-storage
    asserts:
      - equal:
          path: metadata.name
          value: aws-compatible-storage-credentials

  - it: skips Secret creation when existingSecret is set
    set:
      s3.existingSecret: my-aws-compatible-storage-credentials
    asserts:
      - hasDocuments:
          count: 0

  - it: omits UI keys when auth is disabled
    set:
      auth.enabled: false
    asserts:
      - isNotNullOrEmpty:
          path: stringData.AWS_ACCESS_KEY_ID
      - notExists:
          path: stringData.UI_USERNAME
      - notExists:
          path: stringData.UI_PASSWORD

  - it: includes JWT_SECRET when provided
    set:
      auth.jwtSecret: test-jwt-secret
    asserts:
      - equal:
          path: stringData.JWT_SECRET
          value: test-jwt-secret
