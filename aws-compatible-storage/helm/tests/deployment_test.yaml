suite: aws-compatible-storage deployment
values:
  - values/auth.yaml
# configmap/secret required for checksum includes in deployment.yaml
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/secret.yaml
tests:
  - it: renders a single Deployment with pinned image and dual ports
    template: templates/deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/rh-aiservices-bu/s4:0.3.2
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: s3-api
            containerPort: 7480
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: web-ui
            containerPort: 5000
            protocol: TCP
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 5000

  - it: mounts local storage volume when enabled
    template: templates/deployment.yaml
    set:
      storage.localStorage.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: local-storage
            mountPath: /opt/app-root/src/data
      - contains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: local-storage

  - it: uses fullnameOverride for stable consumer DNS naming
    template: templates/deployment.yaml
    set:
      fullnameOverride: aws-compatible-storage
    asserts:
      - equal:
          path: metadata.name
          value: aws-compatible-storage
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: aws-compatible-storage-config
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: aws-compatible-storage-credentials

  - it: injects extraEnv when provided
    template: templates/deployment.yaml
    set:
      extraEnv:
        - name: MY_VAR
          value: my-value
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_VAR
            value: my-value
