suite: aws-compatible-storage ingress
values:
  - values/auth.yaml
tests:
  - it: does not create UI Ingress by default
    templates:
      - templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: creates UI Ingress when enabled
    templates:
      - templates/ingress.yaml
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: aws-compatible-storage.example.com
          paths:
            - path: /
              pathType: Prefix
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - equal:
          path: spec.rules[0].host
          value: aws-compatible-storage.example.com

  - it: does not create S3 API Ingress by default
    templates:
      - templates/ingress-s3.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: creates S3 API Ingress when enabled
    templates:
      - templates/ingress-s3.yaml
    set:
      ingress.s3Api.enabled: true
      ingress.s3Api.hosts:
        - host: s3.aws-compatible-storage.example.com
          paths:
            - path: /
              pathType: Prefix
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.rules[0].host
          value: s3.aws-compatible-storage.example.com
